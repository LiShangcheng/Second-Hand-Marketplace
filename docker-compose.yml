services:
  web:
    build:
      context: ./services/web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5002}
    ports:
      - "3000:3000"
    depends_on:
      - api
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017}
      - MONGO_DB=${MONGO_DB:-marketplace}
      - PORT=5001
      - VERIFICATION_SECRET=${VERIFICATION_SECRET:-local-development-secret}
      - AUTH_TOKEN_TTL_SECONDS=${AUTH_TOKEN_TTL_SECONDS:-604800}
    volumes:
      - ./services/api/static:/app/services/api/static
    ports:
      - "5002:5001"
    depends_on:
      - mongo
    # Uncomment the line below and comment out 'depends_on: mongo' if using MongoDB Atlas
    # (no local mongo container needed)
    # depends_on: []
  mongo:
    build: ./services/mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
volumes:
  mongo-data:
