services:
  web:
    build: ./services/web
    ports:
      - "3000:3000"
    depends_on:
      - api
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017}
      - MONGO_DB=${MONGO_DB:-marketplace}
      - PORT=5001
      - MAIL_MODE=${MAIL_MODE:-console}
      - VERIFICATION_SECRET=${VERIFICATION_SECRET:-local-development-secret}
      - VERIFICATION_TTL_MINUTES=${VERIFICATION_TTL_MINUTES:-10}
      - VERIFICATION_RESEND_SECONDS=${VERIFICATION_RESEND_SECONDS:-60}
      - VERIFICATION_MAX_ATTEMPTS=${VERIFICATION_MAX_ATTEMPTS:-5}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-1}
    volumes:
      - ./services/api/static:/app/services/api/static
    ports:
      - "5002:5001"
    depends_on:
      - mongo
    # Uncomment the line below and comment out 'depends_on: mongo' if using MongoDB Atlas
    # (no local mongo container needed)
    # depends_on: []
  mongo:
    build: ./services/mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
volumes:
  mongo-data:
